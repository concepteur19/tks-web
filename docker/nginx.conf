# Configuration complète de nginx pour l'image du site — docs/devops.md section 3.
# Remplace /etc/nginx/nginx.conf : un utilisateur non privilégié ne peut pas écrire le PID
# ni les fichiers temporaires aux emplacements par défaut, d'où /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_user_agent" $request_time';
  access_log /dev/stdout main;

  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Contrôle de santé, servi par nginx lui-même, hors journal d'accès.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Ressources empreintées par Astro : leur nom change à chaque contenu, cache d'un an.
    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Polices sans empreinte : cache d'une semaine.
    location /fonts/ {
      add_header Cache-Control "public, max-age=604800" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Pages : toujours revalidées, pour qu'une nouvelle version soit vue tout de suite.
    location / {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files $uri $uri/index.html $uri.html =404;
    }

    # Page d'erreur par langue : /en/… reçoit la page anglaise.
    error_page 404 /404.html;
    location /en/ {
      error_page 404 /en/404.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files $uri $uri/index.html $uri.html =404;
    }
  }
}
