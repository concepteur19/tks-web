# Environnement local conteneurisé — docs/devops.md, exercices 2 à 5.
#   docker compose -f docker/compose.yml up dev   → serveur de développement, rechargement automatique
#   docker compose -f docker/compose.yml up web   → image de production servie par nginx

name: kibreeze-web

services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - '4321:4321'
    volumes:
      # Le code du poste, monté en direct : une modification déclenche le rechargement.
      - ..:/app
      # node_modules dans un volume du conteneur, jamais celui du poste : les binaires
      # natifs compilés pour macOS ne tournent pas sous Linux.
      - node_modules:/app/node_modules

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PUBLIC_WHATSAPP_NUMBER: ${PUBLIC_WHATSAPP_NUMBER:-}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    image: kibreeze-web:dev
    ports:
      - '8080:8080'

volumes:
  node_modules:
